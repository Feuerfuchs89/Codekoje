  const touched=Object.keys(SKILLS).filter(k=>S.skill[k]);
  const card=h(`<div class="card stack"><div class="row" style="justify-content:space-between"><div style="min-width:0"><span class="eyebrow">Dein Niveau</span><h3 id="lvlhead"></h3></div><label class="row muted" style="font-size:.85rem;gap:6px" for="niveau">Schwierigkeit<select id="niveau" class="field" style="width:auto;padding:6px 8px"><option value="auto">passt sich an</option><option value="leicht">immer leichter</option><option value="schwer">immer schwerer</option></select></label></div><div class="bars"></div><div class="row" id="trainrow"></div></div>`);
  $("#niveau",card).value=S.niveau;$("#niveau",card).onchange=e=>{S.niveau=e.target.value;save();renderPath()};
  const bars=$(".bars",card);
  if(!touched.length){$("#lvlhead",card).textContent="Noch offen";bars.append(h(`<p class="muted" style="font-size:.9rem">Nach deiner ersten Lektion siehst du hier, wie sicher du in jeder Fähigkeit bist. Die Übungen passen sich daran an.</p>`))}
  else{const avg=touched.reduce((a,k)=>a+S.skill[k].s,0)/touched.length;$("#lvlhead",card).innerHTML=LVL[levelFromScore(avg)]+(S.niveau!=="auto"?` <span class="muted" style="font-size:.85rem;font-weight:400">(Aufgaben ${S.niveau==="leicht"?"leichter":"schwerer"} gestellt)</span>`:"");
    touched.sort((a,b)=>S.skill[a].s-S.skill[b].s).forEach(k=>{const v=S.skill[k].s;
      bars.append(h(`<div class="bar"><span>${esc(SKILLS[k])}</span><span class="track" role="img" aria-label="${v} von 100"><i style="width:${v}%"></i></span><span class="lv">${LVL[levelFromScore(v)]}</span></div>`))})}
  const w=weakestSkill();const tr=$("#trainrow",card);
  if(touched.length){
    const gen=h(`<button class="btn small" type="button">Übung zu ${esc(SKILLS[w])}</button>`);gen.disabled=sampleState!=="ok";gen.title=sampleState==="ok"?"Die KI baut eine neue Übung für deine schwächste Fähigkeit":NO_AI_MSG;gen.onclick=()=>openTraining(w);
    tr.append(gen);
    if(pickRepeat(w)){const rep=h(`<button class="btn ghost small" type="button">Bekannte Aufgabe wiederholen</button>`);rep.onclick=()=>openTraining(w,{mode:"repeat"});tr.append(rep)}}
  box.append(card)}

/* ---------- Lernpfad ---------- */
function lessonIndexUnlocked(){let i=0;while(i<ALL.length&&S.done[ALL[i].id])i++;return i}
function renderPath(){
  const box=$("#tab-path");const next=lessonIndexUnlocked();const doneN=ALL.filter(l=>S.done[l.id]).length;
  box.innerHTML="";
  box.append(h(`<div class="goal card"><div class="goal-txt"><span class="eyebrow">Dein Projekt</span><h2>Kellerfarm mit Raspberry Pi</h2><p class="muted">Licht nach Zeitplan, Lüftung mit Hysterese, Bewässerung nach Bodenfeuchte und ein Messwert-Log. Dieser Pfad bringt dir genau das bei.</p></div><div class="ring" role="img" aria-label="${doneN} von ${ALL.length} Lektionen"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="none" stroke="var(--sunk)" stroke-width="5"/>${doneN?`<circle cx="22" cy="22" r="18" fill="none" stroke="var(--ok)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(doneN/ALL.length*113.1).toFixed(1)} 113.1" transform="rotate(-90 22 22)"/>`:""}</svg><b>${doneN}/${ALL.length}</b></div></div>`));
  renderSkills(box);
  box.append(h(`<h2 style="font-size:1.1rem">${next>=ALL.length?"Alles geschafft. Jetzt baust du die Steuerung im Mentor-Tab.":"Weiter mit: "+esc(ALL[next].title)}</h2>`));
  ETAPPEN.forEach(E=>{
    box.append(h(`<div class="stack" style="gap:4px;margin-top:8px"><span class="eyebrow">${esc(E.title)}</span><p class="muted" style="font-size:.9rem">${esc(E.note)}</p></div>`));
    const route=h(`<div class="route"></div>`);
    ALL.forEach((l,i)=>{if(l.kurs!==E.key)return;
      const st=S.done[l.id]?"done":i===next?"next":"";const num=ALL.filter((x,j)=>x.kurs===E.key&&j<=i).length;
      const b=h(`<button class="stop ${st}" type="button" ${i>next?"disabled":""}><span class="buoy">${S.done[l.id]?"✓":num}</span><span class="txt"><span class="t">${esc(l.title)}</span><br><span class="s">${esc(l.sub)}</span></span><span class="xp">${i>next?"🔒":l.steps.length+" Schritte"}</span></button>`);
      b.onclick=()=>openLesson(i);route.append(b)});
    box.append(route)});
  box.append(h(`<p class="chartnote">Jede Lektion dauert etwa 5 bis 10 Minuten. Falsch beantwortete Fragen kommen am Ende der Lektion noch einmal. Fortschritt und Niveau werden nur in diesem Browser gespeichert.</p>`));
}

function openLesson(li){
  const L=ALL[li];const tags=TAGS[L.id]||[];const lvl=levelFor(tags);
  const before={};tags.forEach(t=>before[t]=skillScore(t)??35);
  const steps=L.steps.slice();let si=0;let gained=0;let lastTask="";
  const recap=L.steps.filter(x=>x.t==="info").map(x=>`<h4>${x.title}</h4>${x.body}${x.code?`<pre class="code">${esc(x.code)}</pre>`:""}`).join("");
  const root=$("#lesson");root.hidden=false;document.body.style.overflow="hidden";
  const close=()=>{root.hidden=true;root.innerHTML="";document.body.style.overflow="";renderPath()};
  function step(){
    const s=steps[si];root.innerHTML="";
    const w=h(`<div class="wrap"><div class="lbar"><button class="x" aria-label="Lektion schließen">×</button><div class="prog"><i style="width:${si/steps.length*100}%"></i></div><span class="eyebrow">${si+1}/${steps.length}</span></div><div class="stack" id="sbody"></div></div>`);
    root.append(w);$(".x",w).onclick=close;const body=$("#sbody",w);
    const nextBtn=h(`<button class="btn" type="button">Weiter</button>`);
    const advance=()=>{si++;if(si<steps.length)step();else finish()};
    nextBtn.onclick=advance;
    if(s.t==="info"){
      body.append(h(`<span class="eyebrow">${esc(L.title)}</span>`),h(`<h2>${s.title}</h2>`),h(`<div class="body">${s.body}</div>`));
      if(s.code){const ide=makeIDE(s.code,"beispiel.py");body.append(ide.el);ide.ta.style.minHeight="90px"}
      const row=h(`<div class="row end"></div>`);row.append(nextBtn);body.append(row);
    }
    if(s.t==="quiz"){
      body.append(h(`<span class="eyebrow">${s.repeat?"Noch einmal":"Frage"}</span>`),h(`<h2>${s.q}</h2>`));
      if(s.code)body.append(h(`<pre class="code">${esc(s.code)}</pre>`));
      const opts=h(`<div class="opts" role="group"></div>`);let pick=-1;
      s.opts.forEach((o,i)=>{const b=h(`<button class="opt" type="button" aria-pressed="false">${esc(o)}</button>`);b.onclick=()=>{if(opts.dataset.locked)return;pick=i;opts.querySelectorAll(".opt").forEach((x,j)=>x.setAttribute("aria-pressed",j===i));check.disabled=false};opts.append(b)});
      body.append(opts);const fb=h(`<div></div>`);body.append(fb);
      const check=h(`<button class="btn" type="button" disabled>Prüfen</button>`);const row=h(`<div class="row end"></div>`);row.append(check);body.append(row);
      check.onclick=()=>{opts.dataset.locked=1;const bs=opts.querySelectorAll(".opt");bs[s.a].classList.add("right");
        if(pick===s.a){fb.className="feedback ok";fb.innerHTML="<b>Richtig.</b> "+s.why;gained+=s.repeat?2:5;bump(tags,s.repeat?3:6)}
        else{bs[pick].classList.add("wrong");fb.className="feedback bad";fb.innerHTML="<b>Nicht ganz.</b> "+s.why+(s.repeat?"":" <span class=\"muted\">Die Frage kommt am Ende noch einmal.</span>");bump(tags,s.repeat?-4:-8);
          if(!s.repeat)steps.push(Object.assign({},s,{repeat:true}))}
        check.replaceWith(nextBtn);nextBtn.focus()};
    }
    if(s.t==="fill"){
      body.append(h(`<span class="eyebrow">${s.repeat?"Noch einmal":"Lückentext"}</span>`),h(`<h2>${s.q}</h2>`));
      const parts=s.code.split("___");const filled=Array(parts.length-1).fill(null);let locked=false;
      const pre=h(`<pre class="code fillcode"></pre>`);body.append(pre);
      const chips=h(`<div class="chips" role="group" aria-label="Bausteine"></div>`);body.append(chips);
      const fb=h(`<div></div>`);body.append(fb);
      const check=h(`<button class="btn" type="button" disabled>Prüfen</button>`);const row=h(`<div class="row end"></div>`);row.append(check);body.append(row);
      const draw=()=>{pre.innerHTML="";parts.forEach((p,i)=>{pre.append(document.createTextNode(p));if(i<filled.length){
        const b=h(`<button type="button" class="slot${filled[i]===null?" empty":""}" aria-label="Lücke ${i+1}"></button>`);b.textContent=filled[i]===null?"  ?  ":filled[i];
        if(locked)b.classList.add(filled[i]===s.blanks[i]?"right":"wrong");
        b.onclick=()=>{if(locked)return;filled[i]=null;draw()};pre.append(b)}});check.disabled=filled.includes(null)};
      s.opts.slice().sort(()=>Math.random()-.5).forEach(o=>{const c=h(`<button type="button" class="chip-opt"></button>`);c.textContent=o;
        c.onclick=()=>{if(locked)return;const i=filled.indexOf(null);if(i<0)return;filled[i]=o;draw()};chips.append(c)});
      draw();
      check.onclick=()=>{locked=true;draw();const ok=filled.every((v,i)=>v===s.blanks[i]);
        if(ok){fb.className="feedback ok";fb.innerHTML="<b>Richtig.</b> "+s.why+(s.output!==undefined?`<div class="eyebrow" style="margin-top:8px">Ausgabe</div><pre class="code" style="margin-top:4px">${esc(s.output||"(keine)")}</pre>`:"");gained+=s.repeat?2:5;bump(tags,s.repeat?3:6)}
        else{fb.className="feedback bad";fb.innerHTML=`<b>Nicht ganz.</b> Richtig wäre: ${s.blanks.map(b=>"<code>"+esc(b)+"</code>").join(", ")}. ${s.why}`+(s.repeat?"":' <span class="muted">Die Aufgabe kommt am Ende noch einmal.</span>');bump(tags,s.repeat?-4:-8);
          if(!s.repeat)steps.push(Object.assign({},s,{repeat:true}))}
        check.replaceWith(nextBtn);nextBtn.focus()};
    }
    if(s.t==="code"){
      lastTask=s.task.replace(/<[^>]+>/g,"");
      renderCodeTask(body,s,{lvl,recap,next:nextBtn,onDone:r=>{gained+=10;bump(tags,codeDelta(r))}});
    }
  }
  function finish(){
    const first=!S.done[L.id];S.done[L.id]=true;const bonus=first?20:0;addXP(gained+bonus);
    const changes=tags.map(t=>`<li><span>${esc(SKILLS[t])}</span><b>${Math.round(before[t])} → ${skillScore(t)}</b></li>`).join("");
    const nl=levelFor(tags);
    root.innerHTML="";const w=h(`<div class="wrap"><div class="stack" style="padding-top:8vh;text-align:center;align-items:center"><svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="32" fill="var(--ok-bg)" stroke="var(--ok)" stroke-width="3"/><path d="M22 37l9 9 19-20" fill="none" stroke="var(--ok)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><h2>${esc(L.title)} geschafft</h2><p class="muted">+${gained+bonus} XP${first?" (inkl. 20 Bonus)":""}</p>${tags.length?`<ul class="deltas">${changes}</ul>`:""}<div class="row" style="justify-content:center" id="fin"></div></div></div>`);
    root.append(w);const fin=$("#fin",w);
    if(tags.length&&sampleState==="ok"){const t=tags.slice().sort((a,b)=>(skillScore(a)??0)-(skillScore(b)??0))[0];
      const extra=h(`<button class="btn ghost" type="button">${nl===0?"Noch eine leichte Übung dazu":nl===2?"Schwerere Bonus-Aufgabe":"Noch eine Übung dazu"}</button>`);
      extra.onclick=()=>openTraining(t,nl===2&&lastTask?{base:lastTask}:{});fin.append(extra)}
    const back=h(`<button class="btn" type="button">Zurück zum Lernpfad</button>`);back.onclick=close;fin.append(back);back.focus()}
  step();
}

      try{const plan=await sampleFn.json(`${rules()}\n\nMicha möchte dieses Projekt in Python bauen: "${goal}". Sein Stand: ${$("#lvl",c).value}.\nZerlege es in 4 bis 7 kleine, aufeinander aufbauende Schritte. Jeder Schritt soll in 10-20 Minuten machbar sein und am Ende ein lauffähiges Zwischenergebnis haben. Passe den Umfang an, damit es im Browser mit Skulpt läuft (keine Dateien, kein Internet).\nAntworte NUR mit JSON in dieser Form:\n{"titel":"kurzer Projektname","schritte":[{"titel":"…","aufgabe":"Was genau soll das Programm nach diesem Schritt können (2-3 Sätze)","lernt":"welches Python-Konzept geübt wird"}],"startcode":"# ein paar Kommentarzeilen als Gerüst, KEINE Lösung"}`,{modelTier:"default"});

    return}

  const cur=M.steps[M.cur];
  const head=h(`<div class="card stack"><div class="row" style="justify-content:space-between"><div style="min-width:0"><span class="eyebrow">Projekt</span><h3 style="font-size:1.2rem">${esc(M.titel)}</h3></div><button class="btn ghost small" id="reset" type="button">Neues Ziel</button></div><ol class="steps"></ol></div>`);
  M.steps.forEach((s,i)=>{const li=h(`<li class="${s.done?"done":""}"><button type="button" ${i===M.cur?'aria-current="step"':""}><span class="n">${s.done?"✓":i+1}</span><span>${esc(s.titel)}</span></button></li>`);$("button",li).onclick=()=>{M.cur=i;save();renderMentor()};$(".steps",head).append(li)});
  let confirmReset=false;$("#reset",head).onclick=e=>{if(!confirmReset){confirmReset=true;e.target.textContent="Wirklich? Tippen zum Bestätigen";return}S.mentor=null;save();renderMentor()};
  box.append(head);
  box.append(h(`<div class="card stack" style="gap:8px"><span class="eyebrow">Schritt ${M.cur+1} von ${M.steps.length}${cur.lernt?" · übt: "+esc(cur.lernt):""}</span><h3>${esc(cur.titel)}</h3><p>${esc(cur.aufgabe)}</p></div>`));
  projectIDE=makeIDE(M.code,"projekt.py");projectIDE.ta.style.minHeight="220px";
  projectIDE.ta.addEventListener("input",()=>{M.code=projectIDE.ta.value;save()});
  box.append(projectIDE.el);

  const ladder=h(`<div class="ladder"><button class="btn ghost small" data-k="frage" type="button">Denkanstoß</button><button class="btn ghost small" data-k="tipp" type="button">Konkreter Tipp</button><button class="btn ghost small" data-k="code" type="button">Teil-Code zeigen</button><button class="btn small" data-k="check" type="button">Schritt prüfen</button></div>`);
  box.append(ladder);
  const chat=h(`<div class="chat" aria-live="polite"></div>`);box.append(chat);
  const form=h(`<form class="row" style="flex-wrap:nowrap"><input id="ask" class="field" placeholder="Frag den Mentor …" autocomplete="off"><button class="btn" type="submit">Senden</button></form>`);box.append(form);
  const stop=h(`<button class="btn ghost small" type="button" hidden>Stopp</button>`);box.append(stop);stop.onclick=()=>mentorCtl?.abort();
  const draw=()=>{chat.innerHTML="";M.chat.slice(-12).forEach(m=>chat.append(h(`<div class="msg ${m.role==="user"?"me":"ai"}"><div class="who">${m.role==="user"?"Du":"Mentor"}</div>${m.role==="user"?"<p>"+esc(m.show||m.content)+"</p>":md(m.content)}</div>`)))};draw();
  const disabled=sampleState!=="ok";ladder.querySelectorAll("button").forEach(b=>b.disabled=disabled);$("button",form).disabled=disabled;

  async function talk(show,instruction){
    const r=projectIDE.last;
    const ctx=`Sein Niveau: ${(()=>{const t=Object.keys(SKILLS).filter(k=>S.skill[k]);return t.length?t.map(k=>SKILLS[k]+" "+S.skill[k].s+"/100").join(", "):"noch keine Lektionen"})()}. Passe Erklärtiefe und Hinweise daran an.\nProjekt: ${M.titel} (Ziel: ${M.goal})\nAktueller Schritt ${M.cur+1}/${M.steps.length}: ${cur.titel} – ${cur.aufgabe}\nSein aktueller Code:\n\`\`\`python\n${projectIDE.ta.value}\n\`\`\`\nLetzte Ausführung: ${r?(r.ok?"ok, Ausgabe:\n"+(r.output||"(keine)").slice(0,1500):"Fehler: "+r.error):"noch nicht ausgeführt"}`;
    M.chat.push({role:"user",content:instruction+"\n\n"+ctx,show});draw();
    const bubble=h(`<div class="msg ai"><div class="who">Mentor</div><p class="muted">Denkt nach …</p></div>`);chat.append(bubble);
    mentorCtl=new AbortController();stop.hidden=false;ladder.querySelectorAll("button").forEach(b=>b.disabled=true);
    const turns=[{role:"user",content:rules()},...M.chat.slice(-10).map(m=>({role:m.role,content:m.content}))];
    if(turns[1]&&turns[1].role==="assistant")turns.splice(1,1);
    try{const {text}=await sampleFn(turns,{cache:false,signal:mentorCtl.signal,onText:({text})=>{bubble.innerHTML='<div class="who">Mentor</div>'+md(text)}});
      M.chat.push({role:"assistant",content:text});addXP(1)}
    catch(e){M.chat.pop();if(e.code!=="cancelled")bubble.innerHTML='<div class="who">Mentor</div><p>'+esc(sampleErr(e))+"</p>";else bubble.remove()}
    stop.hidden=true;ladder.querySelectorAll("button").forEach(b=>b.disabled=false);save()}

  ladder.onclick=async e=>{const k=e.target.dataset?.k;if(!k)return;
    if(k==="check"){if(!projectIDE.last)await projectIDE.run();
      const r=projectIDE.last;e.target.disabled=true;const bubble=h(`<div class="msg ai"><div class="who">Mentor</div><p class="muted">Prüft deinen Schritt …</p></div>`);chat.append(bubble);
      try{const v=await sampleFn.json(`${rules()}\n\nPrüfe, ob Micha diesen Schritt erfüllt hat. Sei fair: kleine Abweichungen in Formulierungen sind ok, die Funktion zählt.\nSchritt: ${cur.titel} – ${cur.aufgabe}\nCode:\n${projectIDE.ta.value}\nAusgabe beim Ausführen:\n${r.ok?(r.output||"(keine)").slice(0,1500):"Fehler: "+r.error}\nAntworte NUR mit JSON: {"bestanden":true|false,"feedback":"2-3 Sätze: was gut ist, was noch fehlt (ohne Lösung)"}`,{modelTier:"default",cache:false});
        const ok=!!v.bestanden;bubble.innerHTML='<div class="who">Mentor · '+(ok?"Schritt geschafft":"noch nicht ganz")+"</div>"+md(String(v.feedback||""));
        M.chat.push({role:"user",content:"Prüfe meinen Schritt.",show:"Schritt prüfen"},{role:"assistant",content:(ok?"Schritt geschafft. ":"Noch nicht ganz. ")+String(v.feedback||"")});
        if(ok&&!cur.done){cur.done=true;addXP(15);if(M.cur<M.steps.length-1)M.cur++;save();setTimeout(renderMentor,1600)}else save()}
      catch(err){bubble.innerHTML='<div class="who">Mentor</div><p>'+esc(sampleErr(err))+"</p>"}e.target.disabled=false;return}
    const map={frage:["Denkanstoß bitte","Gib mir nur einen Denkanstoß in Form einer Frage, wie ich weiterkomme. Kein Code."],tipp:["Konkreter Tipp bitte","Gib mir einen konkreten Tipp, welcher Befehl oder welches Konzept mir hier hilft. Höchstens eine Zeile Code als Muster, nicht meine Lösung."],code:["Teil-Code bitte","Zeig mir einen kleinen Teil des Codes für diesen Schritt (höchstens 5 Zeilen) und erkläre ihn. Den Rest soll ich selbst schreiben."]};
    await talk(...map[k])};
  form.onsubmit=async e=>{e.preventDefault();const q=$("#ask",form).value.trim();if(!q)return;$("#ask",form).value="";await talk(q,q)};
}

/* ---------- Spielwiese ---------- */
function renderPlay(){
  const box=$("#tab-play");if(box.dataset.ready)return;box.dataset.ready=1;
  box.append(h(`<div class="stack" style="gap:6px"><span class="eyebrow">Spielwiese</span><h2>Freies Python</h2><p class="muted">Probier hier aus, was du willst. <code>input()</code> fragt dich in der Konsole. Die Pi-Hardware ist simuliert.</p></div>`));
  const ide=makeIDE(`import board\nimport adafruit_dht\nfrom gpiozero import OutputDevice\n\nsensor = adafruit_dht.DHT22(board.D4)\nluefter = OutputDevice(27)\n\nfor runde in range(8):\n    try:\n        t = sensor.temperature\n        rh = sensor.humidity\n        if rh > 85:\n            luefter.on()\n        elif rh < 75:\n            luefter.off()\n        zustand = "AN" if luefter.is_active else "AUS"\n        print(f"Runde {runde}: {t} °C, {rh} %, Lüfter {zustand}")\n    except RuntimeError:\n        print(f"Runde {runde}: Messfehler")\nluefter.off()\n`,"spielwiese.py");
  ide.ta.style.minHeight="260px";box.append(ide.el);
  box.append(h(`<div class="card ref"><span class="eyebrow">Simulierte Hardware</span><dl style="margin:4px 0 0"><dt>from gpiozero import OutputDevice</dt><dd>OutputDevice(pin, active_high=True) mit .on(), .off(), .toggle(), .value (1 oder 0), .is_active</dd><dt>import board</dt><dd>Pins wie board.D4, board.D17, board.SDA</dd><dt>import adafruit_dht</dt><dd>adafruit_dht.DHT22(board.D4) mit .temperature und .humidity. Feste Beispielwerte, jede 4. Messung wirft einen RuntimeError wie beim echten Sensor.</dd><dt>import time</dt><dd>time.sleep() wartet wirklich. Halte die Pausen hier kurz, Programme werden nach 15 Sekunden gestoppt.</dd></dl></div>`))}

/* ---------- Tabs ---------- */
let currentTab="path";
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;
  document.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-selected",x===b));
  ["path","mentor","play"].forEach(t=>$("#tab-"+t).hidden=t!==currentTab);
  if(currentTab==="mentor")renderMentor();if(currentTab==="play")renderPlay();if(currentTab==="path")renderPath();window.scrollTo(0,0)});
renderStats();renderPath();$("#gear").onclick=openSettings;
</script>

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
